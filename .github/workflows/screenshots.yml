name: App Store Screenshots

# Captures clean, full-resolution App Store screenshots in the iOS Simulator —
# no physical device needed. The app is relaunched once per tab in "screenshot
# mode" (SCREENSHOT_MODE=1), which seeds rights-clean demo data (using the
# app's OWN bundled fish artwork) and opens straight to the requested tab, so
# each capture is deterministic. Download the "app-store-screenshots" artifact
# from the run summary.
#
# iPhone 16 Pro Max = 6.9" display (1320×2868), which Apple accepts for the
# required iPhone screenshot slot. The app is iPhone-only, so no iPad set.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    name: Capture Screenshots
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Currents.xcodeproj \
            -scheme Currents \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Install iOS Simulator
        run: |
          if xcrun simctl list runtimes | grep -q "iOS 26"; then
            echo "iOS 26 runtime already installed"
          else
            xcodebuild -downloadPlatform iOS
          fi

      - name: Create Simulator (6.9" iPhone 16 Pro Max)
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          runtimes = [r for r in data['runtimes'] if 'iOS' in r.get('name','') and '26' in r.get('name','') and r.get('isAvailable', False)]
          if runtimes: print(runtimes[-1]['identifier'])
          ")
          echo "Runtime: $RUNTIME"
          UDID=$(xcrun simctl create "Screenshot-6.9" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max" "$RUNTIME")
          echo "UDID=$UDID" >> $GITHUB_ENV

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Currents.xcodeproj \
            -scheme Currents \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -5

      - name: Boot & prepare simulator
        run: |
          BUNDLE_ID=com.aidanmcconnon.currents
          xcrun simctl boot "$UDID"
          sleep 5

          # Dark appearance for a moody, on-brand look.
          xcrun simctl ui "$UDID" appearance dark

          # Clean "hero" status bar (9:41, full battery/signal).
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 \
            --wifiMode active --wifiBars 3 \
            --dataNetwork wifi || true

          # A scenic coastal location so the forecast looks inviting
          # (Kogel Bay, South Africa — matches the seeded demo spots).
          xcrun simctl location "$UDID" set -34.235,18.848 || true

          # Pre-grant location so no permission dialog covers a screenshot.
          xcrun simctl privacy "$UDID" grant location "$BUNDLE_ID" || true

          APP_PATH=$(find DerivedData -name "Currents.app" -path "*/Debug-iphonesimulator/*" -type d | head -1)
          echo "App: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

      - name: Capture each tab
        run: |
          BUNDLE_ID=com.aidanmcconnon.currents
          OUT=screenshots/6.9
          mkdir -p "$OUT"

          # First launch seeds the demo data; later launches reuse it.
          i=1
          for TAB in collection catches map forecast profile; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            SIMCTL_CHILD_SCREENSHOT_MODE=1 \
            SIMCTL_CHILD_SCREENSHOT_TAB="$TAB" \
              xcrun simctl launch "$UDID" "$BUNDLE_ID"
            # Give SwiftUI + MapKit tiles time to settle.
            sleep 9
            printf -v N "%02d" "$i"
            xcrun simctl io "$UDID" screenshot "$OUT/${N}_${TAB}.png"
            echo "Captured $OUT/${N}_${TAB}.png"
            i=$((i+1))
          done

          ls -la "$OUT"

      - name: Upload Screenshots (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: ios/screenshots/
          retention-days: 90

      # Also publish the PNGs to a dedicated branch (force-pushed each run) so
      # they can be pulled and previewed directly without downloading the
      # artifact. History is a single commit — no binary buildup on master.
      - name: Publish screenshots to branch
        working-directory: ${{ github.workspace }}
        run: |
          TMP=$(mktemp -d)
          cp ios/screenshots/6.9/*.png "$TMP"/ 2>/dev/null || true
          if ! ls "$TMP"/*.png >/dev/null 2>&1; then
            echo "No screenshots to publish"; exit 0
          fi
          cd "$TMP"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b app-store-screenshots
          git add ./*.png
          git commit -q -m "App Store screenshots (automated, ${GITHUB_SHA})"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin app-store-screenshots
          echo "Pushed $(ls *.png | wc -l) screenshots to branch app-store-screenshots"
