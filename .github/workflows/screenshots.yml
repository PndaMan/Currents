name: App Store Screenshots

# Captures App Store screenshots in the iOS Simulator, with no physical device.
# The app is relaunched once per shot in screenshot mode (SCREENSHOT_MODE=1),
# which seeds fictional demo data and opens the screen named by
# SCREENSHOT_SCREEN, so every capture is deterministic. The demo photos in
# ios/AppStore/demo-photos are copied into the simulator's app container only;
# they never ship in the app. Each capture is then framed with a headline by
# scripts/frame_screenshots.py; the custom product pages use that set. The
# listing's own screenshots and the product page header and search results
# art are composed by scripts/store_art.py from ios/AppStore/store-art.json,
# out of a second set of light captures named after their screen (stills/).
# Log catch is driven with AXe through the Add menu, and takes the demo photo
# by itself, so the camera and the species ID in those captures are the
# app's own. Download "app-store-screenshots" from the run: 6.9/ holds the
# raw captures, 6.9-framed/ the framed ones, stills/ the store art captures,
# store/ the composed listing set (6.9/, 6.3/ and creative/), watch/ the
# watch, events/ the in-app event card and details images.
#
# iPhone 16 Pro Max = 6.9" display (1320x2868), which Apple accepts for the
# required iPhone screenshot slot. The app is iPhone-only, so no iPad set.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture Screenshots
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUNDLE_ID: com.aidanmcconnon.currents
      WATCH_BUNDLE_ID: com.aidanmcconnon.currents.watchkitapp
    defaults:
      run:
        working-directory: ios
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen and AXe
        run: |
          brew install xcodegen
          if brew install cameroncooke/axe/axe && axe --version; then
            echo "AXe installed"
          else
            echo "::warning::AXe did not install; the log catch captures are skipped"
          fi

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Currents.xcodeproj \
            -scheme Currents \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Install iOS Simulator
        run: |
          if xcrun simctl list runtimes | grep -q "iOS 26"; then
            echo "iOS 26 runtime already installed"
          else
            xcodebuild -downloadPlatform iOS
          fi

      - name: Create Simulator (6.9" iPhone 16 Pro Max)
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          runtimes = [r for r in data['runtimes'] if 'iOS' in r.get('name','') and '26' in r.get('name','') and r.get('isAvailable', False)]
          if runtimes: print(runtimes[-1]['identifier'])
          ")
          if [ -z "$RUNTIME" ]; then echo "No iOS 26 runtime"; exit 1; fi
          echo "Runtime: $RUNTIME"
          UDID=$(xcrun simctl create "Screenshot-6.9" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for Simulator
        run: |
          if ! xcodebuild build \
            -project Currents.xcodeproj \
            -scheme Currents \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -E "error:" build.log | head -40 || true
            tail -60 build.log
            exit 1
          fi
          tail -5 build.log

      - name: Boot and prepare simulator
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"

          # Dark appearance, as the app is designed dark first.
          xcrun simctl ui "$UDID" appearance dark

          # Clean status bar (9:41, full battery and signal).
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" \
            --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 \
            --wifiMode active --wifiBars 3 \
            --dataNetwork wifi || true

          # Kogel Bay, South Africa, matching the seeded demo spots.
          xcrun simctl location "$UDID" set -34.235,18.848 || true

          # Pre-grant location, camera and photos so no permission dialog
          # covers a screenshot.
          xcrun simctl privacy "$UDID" grant location "$BUNDLE_ID" || true
          xcrun simctl privacy "$UDID" grant camera "$BUNDLE_ID" || true
          xcrun simctl privacy "$UDID" grant photos "$BUNDLE_ID" || true

          APP_PATH=$(find DerivedData -name "Currents.app" -path "*/Debug-iphonesimulator/*" -type d -print -quit)
          if [ -z "$APP_PATH" ]; then echo "Currents.app not found"; exit 1; fi
          echo "App: $APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"

      # The demo photos go into the app's data container on the simulator
      # only. ScreenshotSupport reads Documents/ScreenshotPhotos and falls
      # back to the app's fish artwork if the folder is missing.
      - name: Copy demo photos into the simulator
        run: |
          DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          mkdir -p "$DATA/Documents/ScreenshotPhotos"
          cp AppStore/demo-photos/*.jpg "$DATA/Documents/ScreenshotPhotos/"
          echo "Copied $(ls "$DATA/Documents/ScreenshotPhotos" | wc -l | tr -d ' ') photos"

      # Species ID runs on the BioCLIP model the app downloads on first use.
      # Compile it here and put it where FishModelDownloader keeps it, so the
      # log catch capture is identified without a 160 MB download.
      - name: Install the species model
        continue-on-error: true
        run: |
          curl -sSfL -o "$RUNNER_TEMP/FishID.zip" \
            https://github.com/PndaMan/Currents/releases/download/fish-model/FishID.mlpackage.zip
          mkdir -p "$RUNNER_TEMP/fishid/out"
          unzip -q "$RUNNER_TEMP/FishID.zip" -d "$RUNNER_TEMP/fishid"
          PKG=$(find "$RUNNER_TEMP/fishid" -maxdepth 2 -name '*.mlpackage' -not -name '._*' -not -path '*__MACOSX*' -print -quit)
          xcrun coremlcompiler compile "$PKG" "$RUNNER_TEMP/fishid/out"
          COMPILED=$(find "$RUNNER_TEMP/fishid/out" -maxdepth 1 -name '*.mlmodelc' -print -quit)
          mkdir -p "$DATA/Library/Caches/MLModels"
          cp -R "$COMPILED" "$DATA/Library/Caches/MLModels/FishID.mlmodelc"
          ls "$DATA/Library/Caches/MLModels"

      - name: Capture each screen
        run: |
          OUT=screenshots/6.9
          mkdir -p "$OUT"

          launch() {
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            SIMCTL_CHILD_SCREENSHOT_MODE=1 \
            SIMCTL_CHILD_SCREENSHOT_SCREEN="$1" \
              xcrun simctl launch "$UDID" "$BUNDLE_ID"
          }

          # Warm-up launch: seeds the demo data and lets the forecast cache
          # fill, so every later launch opens on settled content.
          launch today
          sleep 20

          # name|SCREENSHOT_SCREEN|seconds to settle
          SHOTS=(
            "01_today|today|12"
            "02_explore|explore-near|16"
            "03_catch|catch|9"
            "04_logbook|logbook|9"
            "05_lures|lures|10"
            "06_crew|crew|9"
            "07_leaderboard|leaderboard|10"
            "08_profile|profile|9"
          )
          for SHOT in "${SHOTS[@]}"; do
            IFS='|' read -r NAME SCREEN SETTLE <<< "$SHOT"
            launch "$SCREEN"
            sleep "$SETTLE"
            xcrun simctl io "$UDID" screenshot "$OUT/$NAME.png"
            echo "Captured $OUT/$NAME.png"
          done

          ls -la "$OUT"

      # The captures store-art.json composes, in the light look, named after
      # their screen. Points are on the 440x956 screen; the tab bar's Add
      # item is at 220,903.
      - name: Capture the store art screens
        run: |
          OUT=screenshots/stills
          mkdir -p "$OUT"
          HAVE_AXE=0
          if command -v axe >/dev/null; then HAVE_AXE=1; fi
          APPEARANCE=light
          xcrun simctl ui "$UDID" appearance light

          launch() { # launch <screen> [photo]
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1
            SIMCTL_CHILD_TZ=Africa/Johannesburg \
            SIMCTL_CHILD_SCREENSHOT_MODE=1 \
            SIMCTL_CHILD_SCREENSHOT_SCREEN="$1" \
            SIMCTL_CHILD_SCREENSHOT_PHOTO="${2:-}" \
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -appearanceMode "$APPEARANCE" >/dev/null
          }
          still() { xcrun simctl io "$UDID" screenshot "$OUT/$1.png" >/dev/null; echo "Captured $1"; }
          shot() { launch "$1"; sleep "${3:-7}"; still "${2:-$1}"; }

          # screen[:name[:seconds to settle]]
          for SHOT in today explore:explore:10 forecast-day forecast-week catch lures streak leaderboard profile; do
            IFS=':' read -r SCREEN NAME SETTLE <<< "$SHOT"
            shot "$SCREEN" "${NAME:-$SCREEN}" "${SETTLE:-7}"
          done

          # Log catch from the Add menu: the camera shows the demo bass,
          # takes it by itself, and the species is identified on the phone.
          if [ "$HAVE_AXE" = 1 ]; then
            launch today bass-06.jpg
            sleep 5
            axe tap --label "Add" --wait-timeout 4 --udid "$UDID" >/dev/null 2>&1 \
              || axe tap -x 220 -y 903 --udid "$UDID" >/dev/null
            sleep 2.5
            axe tap --id add-menu-log-catch --wait-timeout 4 --udid "$UDID" >/dev/null 2>&1 \
              || axe tap -x 115 -y 640 --udid "$UDID" >/dev/null
            sleep 2.5
            still log-catch-camera
            sleep 8.5
            still log-catch-id
          fi

          APPEARANCE=dark
          xcrun simctl ui "$UDID" appearance dark
          shot fishdex fishdex-dark
          ls -la "$OUT"

      - name: Capture Apple Watch screenshot
        run: |
          OUT=screenshots/watch
          mkdir -p "$OUT"

          # Latest available watchOS runtime and an Ultra 2 (49mm = 410x502,
          # accepted for every App Store watch screenshot slot).
          WRUNTIME=$(xcrun simctl list runtimes --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          rts = [r for r in data['runtimes'] if 'watchOS' in r.get('name','') and r.get('isAvailable', False)]
          if rts: print(rts[-1]['identifier'])
          ")
          if [ -z "$WRUNTIME" ]; then echo "No watchOS runtime"; exit 1; fi
          echo "watchOS runtime: $WRUNTIME"
          WUDID=$(xcrun simctl create "Screenshot-Watch" "com.apple.CoreSimulator.SimDeviceType.Apple-Watch-Ultra-2-49mm" "$WRUNTIME")
          xcrun simctl boot "$WUDID"
          xcrun simctl bootstatus "$WUDID"

          xcrun simctl status_bar "$WUDID" override --time "9:41" || true

          if ! xcodebuild build \
            -project Currents.xcodeproj \
            -scheme CurrentsWatch \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > watch-build.log 2>&1; then
            grep -E "error:" watch-build.log | head -40 || true
            tail -60 watch-build.log
            exit 1
          fi

          WATCH_APP=$(find DerivedData -name "CurrentsWatch.app" -path "*watchsimulator*" -type d -print -quit)
          if [ -z "$WATCH_APP" ]; then echo "CurrentsWatch.app not found"; exit 1; fi
          echo "Watch app: $WATCH_APP"
          xcrun simctl install "$WUDID" "$WATCH_APP"

          SIMCTL_CHILD_SCREENSHOT_MODE=1 \
            xcrun simctl launch "$WUDID" "$WATCH_BUNDLE_ID"
          sleep 8
          xcrun simctl io "$WUDID" screenshot "$OUT/watch.png"
          echo "Captured $OUT/watch.png"
          ls -la "$OUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Frame screenshots with headlines
        run: |
          uv run ../scripts/frame_screenshots.py \
            --input screenshots/6.9 \
            --output screenshots/6.9-framed \
            --captions AppStore/captions.json
          ls -la screenshots/6.9-framed

      - name: Compose the store art
        run: |
          uv run ../scripts/store_art.py --shots screenshots/stills --out screenshots/store
          find screenshots/store -name '*.png' | sort

      - name: Render in-app event media
        run: |
          uv run ../scripts/render_event_media.py \
            --input screenshots/6.9 \
            --events AppStore/events \
            --output screenshots/events
          find screenshots/events -name '*.png' | sort

      - name: Collect diagnostics (crash logs and app log)
        if: always()
        run: |
          mkdir -p screenshots/diagnostics
          # Simulator app crashes land in the host's DiagnosticReports.
          cp ~/Library/Logs/DiagnosticReports/Currents* screenshots/diagnostics/ 2>/dev/null || true
          # The app's own log output for the capture window.
          if [ -n "${UDID:-}" ]; then
            xcrun simctl spawn "$UDID" log show --last 15m \
              --predicate 'processImagePath CONTAINS "Currents"' \
              --style compact > screenshots/diagnostics/oslog.txt 2>/dev/null || true
          fi
          echo "--- diagnostics ---"; ls -la screenshots/diagnostics || true
          tail -40 screenshots/diagnostics/oslog.txt 2>/dev/null || true

      - name: Upload Screenshots (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: ios/screenshots/
          retention-days: 90

      # Also publish the PNGs to a dedicated branch (force-pushed each run) so
      # they can be previewed without downloading the artifact. History is a
      # single commit, so no binaries build up on master.
      - name: Publish screenshots to branch
        working-directory: ${{ github.workspace }}
        run: |
          TMP=$(mktemp -d)
          mkdir -p "$TMP/raw" "$TMP/framed"
          cp ios/screenshots/6.9/*.png "$TMP/raw/" 2>/dev/null || true
          cp ios/screenshots/6.9-framed/*.png "$TMP/framed/" 2>/dev/null || true
          cp ios/screenshots/watch/*.png "$TMP/" 2>/dev/null || true
          cp -R ios/screenshots/stills "$TMP/stills" 2>/dev/null || true
          cp -R ios/screenshots/store "$TMP/store" 2>/dev/null || true
          cp -R ios/screenshots/events "$TMP/events" 2>/dev/null || true
          if ! ls "$TMP"/raw/*.png >/dev/null 2>&1; then
            echo "No screenshots to publish"; exit 0
          fi
          cd "$TMP"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -b app-store-screenshots
          git add -A
          git commit -q -m "App Store screenshots (automated, ${GITHUB_SHA})"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin app-store-screenshots
          echo "Pushed $(find . -name '*.png' | wc -l | tr -d ' ') screenshots to branch app-store-screenshots"
