name: Build Fish ID Model (BioCLIP)

# Converts the BioCLIP image encoder to CoreML and precomputes a text
# embedding for every app species, then publishes the model as a release
# asset and commits the embeddings. The app auto-downloads the model and
# cosine-matches image↔species embeddings on-device (offline) over the exact
# app species list.
#
# The app build sandbox has no network, so this runs on a GitHub runner.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "BioCLIP variant"
        required: false
        default: "bioclip"

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Pin a coremltools-compatible stack: numpy<2 (numpy 2 breaks
        # coremltools' int() cast on 1-element arrays) + a supported torch.
        run: pip install "numpy<2" "torch==2.3.1" "torchvision==0.18.1" open_clip_torch "coremltools==8.1"

      - name: Convert BioCLIP → CoreML + species embeddings
        run: |
          python ml/bioclip_to_coreml.py --out FishID.mlpackage
          du -sh FishID.mlpackage
          ls -lh ios/Currents/Resources/Data/species_embeddings.bin
          # Zip the .mlpackage directory into a single downloadable asset.
          zip -r -q FishID.mlpackage.zip FishID.mlpackage
          ls -lh FishID.mlpackage.zip

      - name: Commit species embeddings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/Currents/Resources/Data/species_embeddings.bin
          if git diff --cached --quiet; then
            echo "No embedding changes."
          else
            git commit -m "Update BioCLIP species text embeddings"
            git push
          fi

      - name: Publish model to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fish-model
          name: Fish ID Model (BioCLIP)
          files: FishID.mlpackage.zip
          body: |
            BioCLIP image encoder (512-d embeddings) for on-device fish ID.
            The app downloads this zipped .mlpackage from the `fish-model`
            release, unzips + compiles it on-device, and cosine-matches against
            the bundled species_embeddings.bin.
