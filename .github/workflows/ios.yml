name: iOS Build & Test

# Each run compiles the app as few times as it can (macOS minutes bill at 10x):
#   pull request     test
#   push to master   test, then testflight (its archive also makes the IPA)
#   manual run       sideload, or testflight with its box ticked; test runs
#                    first only with the tests box ticked

on:
  push:
    branches: [master]
    # Docs and notes don't feed the app build, and the generators under ml/,
    # tiles/ and scripts/ only matter once their output is committed under ios/.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "ml/**"
      - "tiles/**"
      - "scripts/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "ml/**"
      - "tiles/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also upload this build to TestFlight"
        type: boolean
        default: false
      tests:
        description: "Run the unit tests on a simulator"
        type: boolean
        default: false

permissions:
  contents: read

# Serialize runs so overlapping deploys can't revoke each other's signing
# certificate. The TestFlight step revokes old distribution certs and mints a
# new one each run; two concurrent runs would race and one upload would fail
# validation with "Certificate Revoked". The newest push supersedes older runs.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    # Pull requests, pushes to master, and manual runs with the tests box ticked.
    if: github.event_name != 'workflow_dispatch' || inputs.tests
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "--- Verifying resources in project ---"
          grep -c "species_seed" Currents.xcodeproj/project.pbxproj || echo "WARNING: species_seed not found in project!"
          grep -c "gear_catalog_seed" Currents.xcodeproj/project.pbxproj || echo "WARNING: gear_catalog_seed not found in project!"

      # No Package.resolved is committed (XcodeGen regenerates the project each
      # run), so nothing pins versions: key on the packages section of project.yml.
      - name: Key the package cache
        id: spm-key
        run: echo "hash=$(awk '/^[^ #]/{p=($0 ~ /^packages:/)} p' project.yml | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/.spm-cache
          key: spm-${{ runner.os }}-${{ steps.spm-key.outputs.hash }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Currents.xcodeproj \
            -scheme Currents \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Install iOS Simulator
        run: |
          # Check if iOS 26 runtime is already available
          if xcrun simctl list runtimes | grep -q "iOS 26"; then
            echo "iOS 26 runtime already installed"
          else
            echo "Downloading iOS simulator runtime..."
            xcodebuild -downloadPlatform iOS
          fi
          # List available runtimes and devices
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep iPhone | tail -5

      - name: Create Simulator
        run: |
          # Get the latest iOS 26 runtime ID
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          runtimes = [r for r in data['runtimes'] if 'iOS' in r.get('name','') and '26' in r.get('name','') and r.get('isAvailable', False)]
          if runtimes:
              print(runtimes[-1]['identifier'])
          ")
          if [ -z "$RUNTIME" ]; then
            echo "No iOS 26 runtime found: building for the generic simulator, skipping tests"
            echo "SKIP_TESTS=true" >> "$GITHUB_ENV"
            echo "DESTINATION=generic/platform=iOS Simulator" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Using runtime: $RUNTIME"

          # Use iPhone 16 Pro device type
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro"
          echo "Using device type: $DEVICE_TYPE"

          # Create and boot the simulator. The build targets this one device,
          # so it compiles only its architecture (arm64).
          UDID=$(xcrun simctl create "CI-iPhone" "$DEVICE_TYPE" "$RUNTIME")
          echo "Created simulator: $UDID"
          echo "DESTINATION=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Build for testing
        id: build
        run: |
          set -o pipefail
          # Report every compile error in one run instead of stopping at the first.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
          # project.yml defines no schemes, so Xcode autocreates one per target.
          # CurrentsTests depends on Currents, so its scheme builds the app and
          # the test bundle hosted in it in one pass.
          xcodebuild build-for-testing \
            -showBuildTimingSummary \
            -project Currents.xcodeproj \
            -scheme CurrentsTests \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            OTHER_SWIFT_FLAGS='$(inherited) -continue-building-after-errors' \
            2>&1 | tee build.log

      - name: Package .app for Appetize
        run: |
          PRODUCTS_DIR="DerivedData/Build/Products/Debug-iphonesimulator"
          APP_PATH="$PRODUCTS_DIR/Currents.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Expected .app not at $APP_PATH"
            echo "Searching DerivedData for .app bundles:"
            find DerivedData -name "*.app" -type d 2>/dev/null
            exit 1
          fi

          echo "Contents of .app:"
          ls -laR "$APP_PATH/"
          echo "Total .app: $(du -sh "$APP_PATH" | cut -f1)"
          echo "--- Checking for seed JSON files ---"
          find "$APP_PATH" -name "*.json" -o -name "*.JSON" 2>/dev/null || echo "NO JSON FILES FOUND IN BUNDLE"

          cd "$PRODUCTS_DIR"
          zip -r "$GITHUB_WORKSPACE/Currents-simulator.zip" "Currents.app"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Currents-simulator
          path: Currents-simulator.zip
          retention-days: 30

      - name: Test
        id: test
        if: env.SKIP_TESTS != 'true'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Currents.xcodeproj \
            -scheme CurrentsTests \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            2>&1 | tee test.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios/build.log
            ios/test.log

      - name: Summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          {
            echo "## Build Results"
            if [ "$BUILD_OUTCOME" = success ]; then
              echo "Build: passed"
            else
              echo "Build: **FAILED**"
              echo '```'
              grep -E "error:" build.log 2>/dev/null | awk '!seen[$0]++' | head -20
              echo '```'
            fi
            if [ "$TEST_OUTCOME" = success ]; then
              echo "Tests: passed"
            elif [ "$TEST_OUTCOME" = failure ]; then
              echo "Tests: **FAILED** (test.log in the build-logs artifact)"
            elif [ "$SKIP_TESTS" = true ]; then
              echo "Tests: skipped (no simulator runtime)"
            else
              echo "Tests: not run"
            fi
            echo ""
            if [ "$BUILD_OUTCOME" = success ]; then
              echo "Download **Currents-simulator** artifact to test on [Appetize.io](https://appetize.io)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sideload:
    name: Sideload IPA
    # Manual runs that don't go to TestFlight (the testflight job makes the IPA
    # from its archive). Waits for test when the tests box is ticked.
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'failure' && github.event_name == 'workflow_dispatch' && !inputs.testflight }}
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Key the package cache
        id: spm-key
        run: echo "hash=$(awk '/^[^ #]/{p=($0 ~ /^packages:/)} p' project.yml | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/.spm-cache
          key: spm-${{ runner.os }}-${{ steps.spm-key.outputs.hash }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Currents.xcodeproj \
            -scheme Currents \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Build unsigned Release app
        run: |
          set -o pipefail
          xcodebuild build \
            -showBuildTimingSummary \
            -project Currents.xcodeproj \
            -scheme Currents \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData-Device \
            -clonedSourcePackagesDirPath .spm-cache \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            2>&1 | tee device-build.log

      - name: Package IPA
        run: |
          bash "$GITHUB_WORKSPACE/ci/sideload_ipa.sh" \
            DerivedData-Device/Build/Products/Release-iphoneos/Currents.app \
            Currents/App/Currents.entitlements \
            "$GITHUB_WORKSPACE/Currents.ipa"
          echo "Download **Currents-IPA** to sideload this build." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Currents-IPA
          path: Currents.ipa
          retention-days: 90

  testflight:
    name: Archive & Upload to TestFlight
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    # Every push to master, or a manual run of any branch with the TestFlight box
    # ticked. Waits for test, and still runs when test was skipped.
    if: ${{ !cancelled() && needs.test.result != 'failure' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.testflight)) }}
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Install App Store Connect API Key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          KEY_PATH=~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Setup keychain and signing certificate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          # --- 1. Generate a fresh private key + CSR ---
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout ~/private_keys/dist.key \
            -out ~/private_keys/dist.csr \
            -subj "/CN=Currents Distribution/O=Aidan McConnon/C=US"

          # --- 2. Generate JWT for App Store Connect API ---
          python3 - "$ASC_KEY_ID" "$ASC_ISSUER_ID" ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 <<'PYSCRIPT'
          import json, sys, time, subprocess, base64

          key_id, issuer_id, key_path = sys.argv[1], sys.argv[2], sys.argv[3]

          def b64url(data):
              if isinstance(data, str): data = data.encode()
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          def der_to_raw(der):
              """Convert DER ECDSA signature to raw R||S for JWT ES256."""
              assert der[0] == 0x30
              idx = 2
              assert der[idx] == 0x02
              r_len = der[idx + 1]
              r = der[idx + 2 : idx + 2 + r_len]
              idx += 2 + r_len
              assert der[idx] == 0x02
              s_len = der[idx + 1]
              s = der[idx + 2 : idx + 2 + s_len]
              r = r.lstrip(b'\x00').rjust(32, b'\x00')
              s = s.lstrip(b'\x00').rjust(32, b'\x00')
              return r + s

          header = b64url(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}))
          now = int(time.time())
          payload = b64url(json.dumps({"iss": issuer_id, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}))
          signing_input = f"{header}.{payload}"

          der_sig = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", key_path, "-binary"],
              input=signing_input.encode(), capture_output=True, check=True
          ).stdout
          jwt_token = f"{signing_input}.{b64url(der_to_raw(der_sig))}"

          with open("/tmp/asc_jwt.txt", "w") as f:
              f.write(jwt_token)
          print(f"JWT generated (length: {len(jwt_token)})")
          PYSCRIPT

          JWT=$(cat /tmp/asc_jwt.txt)

          # --- 3. Revoke existing Distribution certs (private key is lost between runs) ---
          for CERT_TYPE in DISTRIBUTION IOS_DISTRIBUTION; do
            echo "Looking up existing $CERT_TYPE certificates..."
            CERTS=$(curl -s -H "Authorization: Bearer $JWT" \
              "https://api.appstoreconnect.apple.com/v1/certificates?filter%5BcertificateType%5D=$CERT_TYPE")
            CERT_IDS=$(echo "$CERTS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if 'errors' in data:
              print(f'LIST error: {data[\"errors\"]}', file=sys.stderr)
              sys.exit(0)
          for cert in data.get('data', []):
              print(cert['id'])
          ")
            if [ -n "$CERT_IDS" ]; then
              echo "$CERT_IDS" | while read -r CERT_ID; do
                echo "Revoking old $CERT_TYPE certificate: $CERT_ID"
                STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                  -H "Authorization: Bearer $JWT" \
                  "https://api.appstoreconnect.apple.com/v1/certificates/$CERT_ID")
                echo "  -> HTTP $STATUS"
              done
            else
              echo "No existing $CERT_TYPE certificates found"
            fi
          done

          # --- 4. Create Distribution certificate ---
          python3 - "$(cat ~/private_keys/dist.csr)" <<'PYSCRIPT' > /tmp/cert_request.json
          import json, sys
          print(json.dumps({"data": {"type": "certificates", "attributes": {
              "certificateType": "DISTRIBUTION", "csrContent": sys.argv[1]
          }}}))
          PYSCRIPT

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            "https://api.appstoreconnect.apple.com/v1/certificates" \
            -d @/tmp/cert_request.json)

          echo "$RESPONSE" | python3 -c "
          import json, sys, base64
          data = json.load(sys.stdin)
          if 'errors' in data:
              for e in data['errors']:
                  print(f'API Error: {e.get(\"detail\", e)}', file=sys.stderr)
              sys.exit(1)
          cert_b64 = data['data']['attributes']['certificateContent']
          with open('$HOME/private_keys/distribution.cer', 'wb') as f:
              f.write(base64.b64decode(cert_b64))
          print('Apple Distribution certificate created successfully')
          "

          # --- 5. Setup keychain ---
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # --- 6. Install Apple WWDR intermediate + root certificates ---
          curl -sL "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" \
            -o ~/private_keys/AppleWWDRCAG3.cer
          security import ~/private_keys/AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          curl -sL "https://www.apple.com/appleca/AppleIncRootCertificate.cer" \
            -o ~/private_keys/AppleRoot.cer
          security import ~/private_keys/AppleRoot.cer -k "$KEYCHAIN_PATH" -T /usr/bin/codesign

          # --- 7. Create p12 from matching key + Distribution cert and import ---
          openssl x509 -inform DER -in ~/private_keys/distribution.cer -out ~/private_keys/distribution.pem
          openssl pkcs12 -export -out ~/private_keys/distribution.p12 \
            -inkey ~/private_keys/dist.key \
            -in ~/private_keys/distribution.pem \
            -passout pass:temp123
          security import ~/private_keys/distribution.p12 \
            -P "temp123" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "Installed signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

          # --- 8. Register bundle ID (if not already), then create App Store profile ---
          BUNDLE_IDENTIFIER="com.aidanmcconnon.currents"
          BUNDLE_ID_RESP=$(curl -s -H "Authorization: Bearer $JWT" \
            "https://api.appstoreconnect.apple.com/v1/bundleIds?filter%5Bidentifier%5D=${BUNDLE_IDENTIFIER}")
          BUNDLE_ID_RESOURCE=$(echo "$BUNDLE_ID_RESP" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          ids = data.get('data', [])
          print(ids[0]['id'] if ids else '')
          ")

          if [ -z "$BUNDLE_ID_RESOURCE" ]; then
            echo "Registering bundle ID ${BUNDLE_IDENTIFIER}..."
            python3 - "$BUNDLE_IDENTIFIER" <<'PYSCRIPT' > /tmp/bundle_request.json
          import json, sys
          print(json.dumps({"data": {"type": "bundleIds", "attributes": {
              "identifier": sys.argv[1], "name": "Currents", "platform": "IOS"
          }}}))
          PYSCRIPT
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $JWT" \
              -H "Content-Type: application/json" \
              "https://api.appstoreconnect.apple.com/v1/bundleIds" \
              -d @/tmp/bundle_request.json)
            BUNDLE_ID_RESOURCE=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          if 'errors' in data:
              for e in data['errors']:
                  print(f'API Error: {e.get(\"detail\", e)}', file=sys.stderr)
              sys.exit(1)
          print(data['data']['id'])
          ")
          fi
          echo "Bundle ID resource: $BUNDLE_ID_RESOURCE"

          # Make sure the App ID has the iCloud capability. (Assigning the
          # actual container to the App ID is portal-UI-only — the public API
          # can't do it — so the entitlements-alignment step below keeps the
          # archive working either way.)
          CAPS=$(curl -s -H "Authorization: Bearer $JWT" \
            "https://api.appstoreconnect.apple.com/v1/bundleIds/$BUNDLE_ID_RESOURCE/bundleIdCapabilities")
          echo "App ID capabilities: $(echo "$CAPS" | python3 -c "
          import json, sys
          print([c['attributes'].get('capabilityType') for c in json.load(sys.stdin).get('data', [])])
          ")"
          if ! echo "$CAPS" | grep -q '"ICLOUD"'; then
            echo "Enabling ICLOUD capability on the App ID..."
            python3 - "$BUNDLE_ID_RESOURCE" <<'PYSCRIPT' > /tmp/icloud_cap.json
          import json, sys
          print(json.dumps({"data": {"type": "bundleIdCapabilities", "attributes": {
              "capabilityType": "ICLOUD",
              "settings": [{"key": "ICLOUD_VERSION", "options": [{"key": "XCODE_6"}]}]
          }, "relationships": {"bundleId": {"data": {"id": sys.argv[1], "type": "bundleIds"}}}}}))
          PYSCRIPT
            curl -s -X POST \
              -H "Authorization: Bearer $JWT" \
              -H "Content-Type: application/json" \
              "https://api.appstoreconnect.apple.com/v1/bundleIdCapabilities" \
              -d @/tmp/icloud_cap.json | head -c 400 || true
            echo
          fi

          # Get the freshly-created Distribution cert ID
          DIST_CERT_ID=$(curl -s -H "Authorization: Bearer $JWT" \
            "https://api.appstoreconnect.apple.com/v1/certificates?filter%5BcertificateType%5D=DISTRIBUTION" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          ids = [c['id'] for c in data.get('data', [])]
          print(ids[0] if ids else '')
          ")
          echo "Distribution cert ID: $DIST_CERT_ID"

          # Delete any existing IOS_APP_STORE profile with the same name to avoid conflicts
          PROFILE_NAME="Currents AppStore Manual"
          EXISTING_PROFILES=$(curl -s -H "Authorization: Bearer $JWT" \
            "https://api.appstoreconnect.apple.com/v1/profiles?filter%5BprofileType%5D=IOS_APP_STORE" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for p in data.get('data', []):
              print(p['id'])
          ")
          if [ -n "$EXISTING_PROFILES" ]; then
            echo "$EXISTING_PROFILES" | while read -r PID; do
              echo "Deleting old IOS_APP_STORE profile: $PID"
              curl -s -X DELETE \
                -H "Authorization: Bearer $JWT" \
                "https://api.appstoreconnect.apple.com/v1/profiles/$PID" || true
            done
          fi

          # Create a new IOS_APP_STORE provisioning profile
          python3 - "$PROFILE_NAME" "$BUNDLE_ID_RESOURCE" "$DIST_CERT_ID" <<'PYSCRIPT' > /tmp/profile_request.json
          import json, sys
          name, bundle_resource, cert_id = sys.argv[1], sys.argv[2], sys.argv[3]
          print(json.dumps({
              "data": {
                  "type": "profiles",
                  "attributes": {"name": name, "profileType": "IOS_APP_STORE"},
                  "relationships": {
                      "bundleId": {"data": {"id": bundle_resource, "type": "bundleIds"}},
                      "certificates": {"data": [{"id": cert_id, "type": "certificates"}]}
                  }
              }
          }))
          PYSCRIPT

          PROFILE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            "https://api.appstoreconnect.apple.com/v1/profiles" \
            -d @/tmp/profile_request.json)

          echo "$PROFILE_RESPONSE" | python3 -c "
          import json, sys, base64, plistlib, subprocess, os
          data = json.load(sys.stdin)
          if 'errors' in data:
              for e in data['errors']:
                  print(f'API Error: {e.get(\"detail\", e)}', file=sys.stderr)
              sys.exit(1)
          content = base64.b64decode(data['data']['attributes']['profileContent'])
          tmp = '/tmp/profile.mobileprovision'
          with open(tmp, 'wb') as f:
              f.write(content)
          # CMS-signed plist - decode with security tool
          result = subprocess.run(['security', 'cms', '-D', '-i', tmp], capture_output=True, check=True)
          plist = plistlib.loads(result.stdout)
          uuid, name = plist['UUID'], plist['Name']
          dest = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles')
          os.makedirs(dest, exist_ok=True)
          with open(f'{dest}/{uuid}.mobileprovision', 'wb') as f:
              f.write(content)
          with open('/tmp/profile_meta', 'w') as f:
              f.write(f'{uuid}\n{name}\n')
          print(f'Profile installed: {name} (UUID: {uuid})')
          "

          PROFILE_UUID=$(sed -n '1p' /tmp/profile_meta)
          PROFILE_NAME=$(sed -n '2p' /tmp/profile_meta)
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Provision app extensions (widget + watch)
        run: |
          set -euo pipefail
          # This job runs with working-directory: ios, but the script lives at
          # the repo root — reference it via GITHUB_WORKSPACE.
          # Provision the widget AND the embedded watch app so ExportOptions maps
          # every bundle in the archive to a profile. The script registers each
          # bundle id (creating it in the portal if needed) and mints its
          # App Store profile.
          python3 "$GITHUB_WORKSPACE/ci/provision_extensions.py" \
            --main "com.aidanmcconnon.currents=$PROFILE_NAME" \
            --ext  "com.aidanmcconnon.currents.widgets=Currents Widgets AppStore Manual" \
            --ext  "com.aidanmcconnon.currents.watchkitapp=Currents Watch AppStore Manual"

      - name: Align entitlements with provisioning profile
        run: |
          set -euo pipefail
          # The profile is generated fresh each run, so it carries exactly the
          # entitlements the App ID supports. If the App ID doesn't have the
          # iCloud container assigned yet (portal-UI-only), archiving with the
          # iCloud entitlements fails — strip them for this archive so the
          # TestFlight upload still succeeds. Once the container is assigned
          # in the portal, the profile picks it up and the entitlements stay.
          security cms -D -i ~/Library/MobileDevice/"Provisioning Profiles"/${PROFILE_UUID}.mobileprovision > /tmp/profile_decoded.plist
          python3 <<'PYSCRIPT'
          import plistlib
          prof = plistlib.load(open('/tmp/profile_decoded.plist', 'rb'))
          ents = prof.get('Entitlements', {})
          containers = ents.get('com.apple.developer.icloud-container-identifiers') or []
          print('Profile iCloud containers:', containers)
          ent_path = 'Currents/App/Currents.entitlements'
          app = plistlib.load(open(ent_path, 'rb'))
          changed = False

          # iCloud: strip if the profile's App ID has no container assigned yet.
          if 'iCloud.com.aidanmcconnon.currents' in containers:
              print('Profile carries the iCloud container - keeping iCloud entitlements.')
          else:
              removed = [k for k in list(app) if 'icloud' in k or 'ubiquity' in k]
              for k in removed:
                  del app[k]
              changed = changed or bool(removed)
              print('WARNING: profile has NO iCloud container - archiving WITHOUT:', removed)
              print('Restore: developer.apple.com > Identifiers > com.aidanmcconnon.currents')
              print('  > iCloud > assign container iCloud.com.aidanmcconnon.currents.')

          # Push: strip aps-environment if the profile doesn't grant Push, so the
          # archive still succeeds before Push Notifications is enabled on the App
          # ID. Once enabled, the minted profile carries it and it stays.
          if 'aps-environment' in ents:
              print('Profile carries Push capability - keeping aps-environment.')
          elif 'aps-environment' in app:
              del app['aps-environment']
              changed = True
              print('WARNING: profile has NO Push capability - archiving WITHOUT aps-environment.')
              print('Enable: developer.apple.com > Identifiers > com.aidanmcconnon.currents')
              print('  > tick Push Notifications > Save. Next master build enables push.')

          if changed:
              with open(ent_path, 'wb') as f:
                  plistlib.dump(app, f)
          PYSCRIPT

      - name: Key the package cache
        id: spm-key
        run: echo "hash=$(awk '/^[^ #]/{p=($0 ~ /^packages:/)} p' project.yml | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/.spm-cache
          key: spm-${{ runner.os }}-${{ steps.spm-key.outputs.hash }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Currents.xcodeproj \
            -scheme Currents \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Archive
        id: archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -showBuildTimingSummary \
            -project Currents.xcodeproj \
            -scheme Currents \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/Currents.xcarchive \
            -clonedSourcePackagesDirPath .spm-cache \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=DBC26UPRGK \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee archive.log

      - name: Create ExportOptions.plist
        run: |
          python3 > $RUNNER_TEMP/ExportOptions.plist <<'PYSCRIPT'
          import plistlib
          # Map every bundle id -> profile name provisioned this run (main app
          # plus each embedded extension).
          profiles = {}
          for line in open("/tmp/ext_profiles"):
              line = line.strip()
              if "=" in line:
                  bundle, name = line.split("=", 1)
                  profiles[bundle] = name
          options = {
              "method": "app-store-connect",
              "teamID": "DBC26UPRGK",
              "destination": "upload",
              "signingStyle": "manual",
              "provisioningProfiles": profiles,
          }
          import sys
          sys.stdout.buffer.write(plistlib.dumps(options))
          PYSCRIPT
          cat $RUNNER_TEMP/ExportOptions.plist

      - name: Export & Upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Currents.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            2>&1 | tee export.log

      # The sideload IPA comes from the app this archive built, so it costs no
      # second compile. It's made even when the upload fails. Align entitlements
      # may have stripped iCloud from the working copy, so fakesign with the
      # committed entitlements, as the sideload job does.
      - name: Package sideload IPA from the archive
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        run: |
          git show HEAD:ios/Currents/App/Currents.entitlements > "$RUNNER_TEMP/Currents.entitlements"
          bash "$GITHUB_WORKSPACE/ci/sideload_ipa.sh" \
            "$RUNNER_TEMP/Currents.xcarchive/Products/Applications/Currents.app" \
            "$RUNNER_TEMP/Currents.entitlements" \
            "$GITHUB_WORKSPACE/Currents.ipa"
          echo "Download **Currents-IPA** to sideload this build." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Currents-IPA
          path: Currents.ipa
          retention-days: 90

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $KEYCHAIN_PATH 2>/dev/null || true
          rm -rf ~/private_keys

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export.log

  release-ipa:
    name: Create Release
    # On master the IPA comes from the testflight job's archive.
    needs: testflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Currents-IPA

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} (${{ steps.sha.outputs.short }})"
          body: |
            Automated build from commit ${{ github.sha }}

            **Commit:** `${{ steps.sha.outputs.short }}`
            **Message:** ${{ github.event.head_commit.message }}
          files: Currents.ipa
          make_latest: true

      - name: Trigger source update
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.SOURCE_REPO_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/PndaMan/sidestore-source/dispatches \
            -d '{"event_type":"ipa-updated"}'
        continue-on-error: true
