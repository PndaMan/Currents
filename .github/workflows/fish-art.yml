name: Generate Fish Illustrations

# Generates flat per-species fish illustrations (Catchr style) for free via
# Pollinations.ai and commits them. Resumable: re-run until all species have
# art (the script skips ones already done). Replaces the photo thumbnails.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max images to generate this run (0 = all remaining)"
        required: false
        default: "0"
      force:
        description: "Regenerate everything"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Generate illustrations
        run: |
          ARGS="--limit ${{ github.event.inputs.limit }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python scripts/generate_fish_art.py $ARGS

      - name: Commit art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/Currents/Resources/Assets.xcassets/Fish
          if git diff --cached --quiet; then
            echo "No new art."
          else
            git commit -m "Add generated fish illustrations (batch)"
            git push
          fi
