name: Generate Fish Illustrations

# Generates flat per-species fish illustrations (Catchr style) by redrawing
# each species' real reference photo with Gemini 2.5 Flash Image (Nano Banana)
# and commits them. Uses the free Google tier if GEMINI_API_KEY is set, else
# OpenRouter (OPENROUTER_API_KEY). Free tier is ~500 img/day, so it runs over a
# few days; re-running just continues where it left off.
# Resumable: re-run until all species have art (the script skips ones already
# done). Replaces the photo thumbnails.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max images to generate this run (0 = all remaining)"
        required: false
        default: "0"
      force:
        description: "Regenerate everything"
        required: false
        default: "false"
      ids:
        description: "Comma-separated species ids to (re)generate (testing)"
        required: false
        default: ""
      model:
        description: "OpenRouter image model"
        required: false
        default: "google/gemini-2.5-flash-image"
      aspect:
        description: "image_config aspect_ratio (e.g. 1:1); blank = model default"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Generate illustrations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OR_MODEL: ${{ github.event.inputs.model }}
          OR_ASPECT: ${{ github.event.inputs.aspect }}
        run: |
          ARGS="--limit ${{ github.event.inputs.limit }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ github.event.inputs.ids }}" ]; then ARGS="$ARGS --ids ${{ github.event.inputs.ids }}"; fi
          python scripts/generate_fish_art.py $ARGS

      - name: Commit art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/Currents/Resources/Assets.xcassets/Fish
          if git diff --cached --quiet; then
            echo "No new art."
          else
            git commit -m "Add generated fish illustrations (batch)"
            git push
          fi
