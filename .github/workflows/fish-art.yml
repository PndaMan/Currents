name: Generate Fish Illustrations

# Flat per-species fish illustrations (Catchr style): each species' real photo is
# redrawn into a facing-left flat illustration with Gemini 2.5 Flash Image (Nano
# Banana). Needs the GEMINI_API_KEY repo secret (paid tier for batch).
#
# Modes (input `mode`):
#   live     - synchronous, one image at a time (good for small/test runs);
#              falls back to OpenRouter if only OPENROUTER_API_KEY is set
#   submit   - queue the whole set as one Gemini Batch job (50% off); records
#              .fish_batch/job.json
#   collect  - poll the batch job; when it succeeds, download + write the art.
#              Re-run collect until done (results persist, never re-charges).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "live | submit | collect"
        required: true
        default: "collect"
      limit:
        description: "live: max images this run (0 = all remaining)"
        required: false
        default: "0"
      force:
        description: "regenerate ALL species (uniform set)"
        required: false
        default: "false"
      ids:
        description: "comma-separated species ids (test batch)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow google-genai numpy scipy

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "submit" ]; then
            ARGS="submit"
            if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
            if [ -n "${{ github.event.inputs.ids }}" ]; then ARGS="$ARGS --ids ${{ github.event.inputs.ids }}"; fi
            python scripts/fish_art_batch.py $ARGS
          elif [ "$MODE" = "collect" ]; then
            python scripts/fish_art_batch.py collect
          else
            ARGS="--limit ${{ github.event.inputs.limit }}"
            if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
            if [ -n "${{ github.event.inputs.ids }}" ]; then ARGS="$ARGS --ids ${{ github.event.inputs.ids }}"; fi
            python scripts/generate_fish_art.py $ARGS
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/Currents/Resources/Assets.xcassets/Fish .fish_batch/job.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Fish art: ${{ github.event.inputs.mode }}"
            git push
          fi
