name: Fish Illustrations (Gemini Batch)

# Full-set fish illustrations via the Gemini Batch API (Nano Banana at 50% off,
# ~$0.0195/image). Two phases:
#   mode=submit   -> queues all species (or --force / --ids) as one batch job,
#                    records .fish_batch/job.json
#   mode=collect  -> polls the job; when it succeeds, downloads results, writes
#                    the imagesets, and commits. Re-run collect until done
#                    (results persist on Google's side, so it never re-charges).
# Needs the GEMINI_API_KEY repo secret on a paid (billed) Google project.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "submit or collect"
        required: true
        default: "collect"
      force:
        description: "submit: queue ALL species (uniform set)"
        required: false
        default: "false"
      ids:
        description: "submit: comma-separated ids for a test batch"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai pillow requests

      - name: Run batch phase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "submit" ]; then
            ARGS="submit"
            if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
            if [ -n "${{ github.event.inputs.ids }}" ]; then ARGS="$ARGS --ids ${{ github.event.inputs.ids }}"; fi
          else
            ARGS="collect"
          fi
          python scripts/fish_art_batch.py $ARGS

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/Currents/Resources/Assets.xcassets/Fish .fish_batch/job.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Fish art batch: ${{ github.event.inputs.mode }}"
            git push
          fi
